<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 340" role="img" aria-labelledby="title desc">
  <title id="title">Open ink-wash scroll and brush</title>
  <desc id="desc">A pale open paper scroll with crisp ragged contours, abstract brush marks, and a fine writing brush laid across it.</desc>
  <defs>
    <linearGradient id="paperWash" x1="0" y1="0" x2="0.92" y2="1">
      <stop stop-color="#fffaf0"/>
      <stop offset="0.48" stop-color="#eee5d2"/>
      <stop offset="1" stop-color="#d8cbb4"/>
    </linearGradient>
    <linearGradient id="handleWash" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#28251f"/>
      <stop offset="0.52" stop-color="#6f6659"/>
      <stop offset="1" stop-color="#25231f"/>
    </linearGradient>
    <filter id="fineRag" x="-8%" y="-10%" width="116%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.021 0.095" numOctaves="2" seed="17" result="lineNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="lineNoise" scale="1.6" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <filter id="softPaper" x="-10%" y="-14%" width="120%" height="128%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.012 0.052" numOctaves="3" seed="8" result="paperNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="paperNoise" scale="3.6" xChannelSelector="G" yChannelSelector="R" result="warped"/>
      <feGaussianBlur in="warped" stdDeviation="0.22"/>
    </filter>
    <filter id="washBlur" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <mask id="dryPaper">
      <rect width="512" height="340" fill="black"/>
      <path d="M65 70 C151 61 356 62 448 72 C456 115 456 210 449 253 C357 264 151 263 64 252 C55 205 56 116 65 70 Z" fill="white"/>
      <path d="M94 74 C191 67 324 71 422 69" fill="none" stroke="black" stroke-width="2.4" stroke-dasharray="31 16 6 22" opacity="0.5"/>
      <path d="M92 250 C181 257 335 254 423 249" fill="none" stroke="black" stroke-width="2" stroke-dasharray="12 25 49 17" opacity="0.38"/>
    </mask>
  </defs>

  <!-- A quiet gray wash grounds the transparent sprite. -->
  <ellipse cx="257" cy="267" rx="194" ry="24" fill="#302d28" opacity="0.14" filter="url(#washBlur)"/>

  <g mask="url(#dryPaper)" filter="url(#softPaper)">
    <path d="M65 70 C151 61 356 62 448 72 C456 115 456 210 449 253 C357 264 151 263 64 252 C55 205 56 116 65 70 Z" fill="url(#paperWash)"/>
    <path d="M73 82 C171 75 344 77 439 82 C445 125 444 203 438 241 C337 250 172 249 73 241 C68 200 68 121 73 82 Z" fill="#fbf6e9" opacity="0.32"/>
    <path d="M86 103 C182 91 336 105 427 95 C349 118 177 108 86 128 Z" fill="#8f98a8" opacity="0.055"/>
    <path d="M90 210 C184 190 335 217 424 198 C337 225 181 214 90 231 Z" fill="#6d675d" opacity="0.06"/>
  </g>

  <!-- Rolled ends and paper contour. -->
  <g fill="none" stroke="#34312b" stroke-linecap="round" stroke-linejoin="round" filter="url(#fineRag)">
    <path d="M65 70 C151 61 356 62 448 72 C456 115 456 210 449 253 C357 264 151 263 64 252 C55 205 56 116 65 70 Z" stroke-width="3.4"/>
    <path d="M65 70 C43 72 37 98 43 121 C48 139 58 144 68 135 C77 127 74 111 64 107 C54 102 49 112 51 125" stroke-width="4"/>
    <path d="M64 252 C45 252 40 233 45 218 C50 203 62 199 70 208 C77 217 73 232 64 233 C57 234 54 226 57 220" stroke-width="3.3" opacity="0.78"/>
    <path d="M448 72 C471 73 476 98 470 121 C465 139 455 144 446 135 C437 127 440 111 450 107 C460 103 466 113 463 126" stroke-width="4"/>
    <path d="M449 253 C469 252 473 232 468 218 C463 203 452 199 444 208 C437 217 441 232 450 233 C457 234 460 226 457 220" stroke-width="3.3" opacity="0.78"/>
    <path d="M72 84 C66 127 67 199 72 239 M440 83 C446 127 445 199 439 240" stroke-width="1.7" opacity="0.5"/>
  </g>

  <!-- Abstract, intentionally unreadable calligraphic notes. -->
  <g fill="none" stroke="#393731" stroke-linecap="round" filter="url(#fineRag)">
    <path d="M112 116 C145 113 171 122 199 114 C212 110 222 110 232 108" stroke-width="5.5"/>
    <path d="M116 146 C145 151 174 139 215 144" stroke-width="3.6" opacity="0.65"/>
    <path d="M109 178 C137 162 164 184 194 169 C209 162 224 164 238 158" stroke-width="6"/>
    <path d="M282 112 C313 120 341 109 390 103" stroke-width="5"/>
    <path d="M278 145 C311 137 343 148 395 131" stroke-width="3.4" opacity="0.62"/>
    <path d="M283 174 C305 157 330 183 352 166 C365 157 381 159 398 151" stroke-width="5.7"/>
    <path d="M120 208 C158 200 190 207 222 198 M285 206 C318 196 356 205 390 190" stroke-width="2.3" opacity="0.48"/>
  </g>
  <g fill="#2d2a25" opacity="0.5">
    <circle cx="104" cy="184" r="2.4"/>
    <circle cx="231" cy="106" r="1.8"/>
    <ellipse cx="275" cy="113" rx="4" ry="1.3" transform="rotate(-13 275 113)"/>
  </g>

  <!-- A precise brush silhouette with soft material wash. -->
  <g filter="url(#fineRag)">
    <path d="M100 292 C193 264 294 232 392 198" fill="none" stroke="#1f1d19" stroke-width="14" stroke-linecap="round" opacity="0.2" transform="translate(4 6)"/>
    <path d="M102 284 C196 255 297 224 391 191" fill="none" stroke="url(#handleWash)" stroke-width="11" stroke-linecap="round"/>
    <path d="M104 280 C188 256 286 224 378 194" fill="none" stroke="#cbc0ad" stroke-width="2.1" stroke-linecap="round" opacity="0.32"/>
    <path d="M386 183 L420 166 L408 201 L391 195 Z" fill="#a79d8e" stroke="#2a2823" stroke-width="3"/>
    <path d="M419 166 C435 155 449 153 463 154 C454 170 439 187 408 201 C415 186 420 176 419 166 Z" fill="#24231f" stroke="#24231f" stroke-width="2.5"/>
    <path d="M427 167 C439 162 447 160 457 159 M419 178 C432 171 442 168 451 166 M414 189 C428 181 438 176 444 172" fill="none" stroke="#8c867c" stroke-width="1.7" stroke-linecap="round" opacity="0.46"/>
    <path d="M91 288 C100 279 110 277 120 282 C113 292 102 299 88 299 Z" fill="#24231f"/>
    <!-- A faint indigo binding keeps the shared sprite viewport under two red marks. -->
    <path d="M116 276 L129 272 L134 287 L121 291 Z" fill="#59647a" opacity="0.72"/>
  </g>
</svg>
