<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-labelledby="title desc">
  <title id="title">Plain round paper lantern</title>
  <desc id="desc">A round unmarked paper lantern hanging from a simple cord, drawn with crisp ink contours and one warm vermillion glow.</desc>
  <defs>
    <radialGradient id="lanternGlow" cx="48%" cy="48%" r="57%">
      <stop offset="0" stop-color="#d96c55" stop-opacity="0.78"/>
      <stop offset="0.38" stop-color="#e4a18b" stop-opacity="0.6"/>
      <stop offset="0.74" stop-color="#c73e2e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f3eadc" stop-opacity="0.94"/>
    </radialGradient>
    <linearGradient id="paperSheen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff8eb" stop-opacity="0.8"/>
      <stop offset="0.45" stop-color="#f1d8c7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9d5548" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="fineRag" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.082" numOctaves="2" seed="23" result="lineNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="lineNoise" scale="6.5" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <filter id="paperRag" x="-16%" y="-16%" width="132%" height="132%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.011 0.044" numOctaves="3" seed="7" result="paperNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="paperNoise" scale="4" xChannelSelector="G" yChannelSelector="R"/>
    </filter>
  </defs>

  <!-- Simple cord and knot. -->
  <g fill="none" stroke="#2b2924" stroke-linecap="round" filter="url(#fineRag)">
    <path d="M180 18 C176 48 184 73 179 105" stroke-width="5"/>
    <path d="M166 104 C174 96 186 96 194 104 C192 114 184 120 180 127 C175 119 167 114 166 104 Z" stroke-width="4"/>
  </g>

  <!-- One visual vermillion cluster lives entirely inside the paper body. -->
  <g filter="url(#paperRag)">
    <path d="M180 127 C242 127 286 178 291 250 C296 323 254 381 180 386 C106 381 64 323 69 250 C74 178 118 127 180 127 Z" fill="url(#lanternGlow)" stroke="#2a2823" stroke-width="6"/>
    <path d="M113 155 C139 133 166 131 180 131 C144 175 132 324 180 381 C131 377 97 337 89 285 C80 228 89 180 113 155 Z" fill="url(#paperSheen)" opacity="0.62"/>
    <path d="M247 157 C221 134 194 131 180 131 C216 177 228 323 180 381 C230 377 264 337 272 285 C280 228 271 181 247 157 Z" fill="#7b4038" opacity="0.08"/>
  </g>

  <!-- Plain ribs; no writing or decorative symbol. -->
  <g fill="none" stroke="#3b3731" stroke-linecap="round" filter="url(#fineRag)">
    <path d="M91 195 C137 207 222 207 269 195" stroke-width="3.4" opacity="0.58"/>
    <path d="M73 245 C128 257 231 257 287 245" stroke-width="3.6" opacity="0.65"/>
    <path d="M75 296 C132 306 228 306 285 296" stroke-width="3.4" opacity="0.58"/>
    <path d="M97 344 C143 351 216 351 263 344" stroke-width="3.2" opacity="0.5"/>
    <path d="M180 132 C160 176 157 329 180 381 M180 132 C200 176 203 329 180 381" stroke-width="2.2" opacity="0.28"/>
  </g>

  <!-- Minimal top and bottom caps continue the round silhouette. -->
  <g fill="#302d28" stroke="#24221e" stroke-linejoin="round" filter="url(#fineRag)">
    <path d="M126 128 C140 111 160 104 180 104 C201 104 220 111 234 128 L222 143 C197 136 162 136 138 143 Z" stroke-width="5"/>
    <path d="M126 383 C142 396 160 402 180 402 C201 402 219 396 234 383 L222 371 C198 378 162 378 138 371 Z" stroke-width="5"/>
  </g>
  <g fill="none" stroke="#2b2924" stroke-linecap="round" filter="url(#fineRag)">
    <path d="M180 402 L180 435" stroke-width="5"/>
    <path d="M180 435 C167 448 166 462 175 476 M180 435 C194 448 194 463 185 478" stroke-width="3.5"/>
  </g>
</svg>
