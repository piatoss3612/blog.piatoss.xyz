<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Vermillion abstract p seal impression</title>
  <desc id="desc">A crisp double-line square seal with an abstract carved p, ragged stamped edges, and restrained ink-starvation gaps.</desc>
  <defs>
    <filter id="stampRag" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.026 0.071" numOctaves="3" seed="41" result="stampNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="stampNoise" scale="2.3" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <filter id="softBleed" x="-16%" y="-16%" width="132%" height="132%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.018" numOctaves="2" seed="9" result="bleedNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="bleedNoise" scale="3" result="warped"/>
      <feGaussianBlur in="warped" stdDeviation="1.2"/>
    </filter>
    <mask id="starvation">
      <rect width="256" height="256" fill="white"/>
      <g fill="black">
        <path d="M37 65 C48 61 60 62 72 66 L68 71 C56 68 47 70 37 74 Z"/>
        <path d="M180 37 C193 35 207 38 219 44 L216 50 C202 45 192 47 180 51 Z"/>
        <path d="M39 181 C49 176 62 178 72 184 L68 190 C57 186 47 189 38 194 Z"/>
        <path d="M169 213 C185 207 202 209 219 216 L216 223 C199 217 185 220 170 226 Z"/>
        <ellipse cx="69" cy="116" rx="12" ry="3" transform="rotate(-12 69 116)"/>
        <ellipse cx="197" cy="157" rx="13" ry="3.5" transform="rotate(9 197 157)"/>
        <circle cx="50" cy="214" r="3.4"/>
        <circle cx="211" cy="92" r="2.8"/>
      </g>
      <g fill="none" stroke="black" stroke-linecap="round">
        <path d="M43 92 L78 87 M176 75 L215 81 M43 148 L67 144 M187 190 L218 193" stroke-width="3.5" stroke-dasharray="15 8 4 9" opacity="0.76"/>
      </g>
    </mask>
  </defs>

  <!-- A pale under-impression suggests pressure bleeding into paper. -->
  <rect x="27" y="27" width="202" height="202" rx="5" fill="#c73e2e" opacity="0.12" filter="url(#softBleed)"/>

  <g mask="url(#starvation)" fill="none" stroke="#b83a2c" stroke-linecap="round" stroke-linejoin="round" filter="url(#stampRag)">
    <path d="M32 31 C82 25 178 27 225 34 C231 83 229 178 222 224 C174 231 80 229 33 221 C27 173 27 78 32 31 Z" stroke-width="13"/>
    <path d="M49 48 C91 43 168 45 208 50 C213 91 212 168 207 207 C165 213 91 212 50 206 C45 165 44 90 49 48 Z" stroke-width="3.8" opacity="0.72"/>
    <!-- Abstract lowercase p: decisive stem, open bowl, generous negative space. -->
    <path d="M99 194 L99 72" stroke-width="20"/>
    <path d="M104 83 C139 61 179 78 181 113 C183 148 148 165 105 147" stroke-width="17"/>
    <path d="M119 100 C141 87 160 96 160 115 C160 132 143 139 121 131" stroke-width="6" opacity="0.8"/>
  </g>

  <g fill="#b83a2c" opacity="0.62" filter="url(#stampRag)">
    <circle cx="25" cy="91" r="2.4"/>
    <circle cx="232" cy="177" r="2.1"/>
    <ellipse cx="78" cy="235" rx="7" ry="2" transform="rotate(-8 78 235)"/>
  </g>
</svg>
