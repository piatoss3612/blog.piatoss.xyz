<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ink Theme — Character Revision</title>
  <style>
    :root {
      --paper: #f2ebdc;
      --paper-raised: rgba(255, 252, 244, 0.78);
      --ink: #211f1b;
      --ink-mid: #5f5a51;
      --ink-pale: #9c9487;
      --vermilion: #b83a2c;
      --line: rgba(52, 47, 40, 0.18);
      --indigo-wash: rgba(75, 85, 113, 0.1);
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: url("washi-texture.svg");
      background-repeat: repeat;
      background-size: 512px 512px;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(118deg, transparent 0 62%, var(--indigo-wash) 100%);
      mix-blend-mode: multiply;
      opacity: 0.45;
    }

    main {
      position: relative;
      width: min(100%, 1800px);
      margin: 0 auto;
      padding: clamp(24px, 4vw, 72px) clamp(16px, 3vw, 52px) 80px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 24px;
      margin: 0 0 clamp(30px, 5vw, 70px);
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    h1, h2, p, figure { margin: 0; }

    h1 {
      max-width: 11ch;
      font-size: clamp(42px, 7vw, 104px);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 0.9;
    }

    .eyebrow,
    figcaption,
    .note {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.11em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .eyebrow { color: var(--vermilion); }
    .note { max-width: 34ch; color: var(--ink-mid); text-align: right; }

    section + section { margin-top: clamp(54px, 8vw, 118px); }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
    }

    h2 {
      font-size: clamp(20px, 2vw, 30px);
      font-weight: 500;
      letter-spacing: -0.025em;
    }

    figcaption { color: var(--ink-mid); }

    .art-frame {
      overflow: hidden;
      border: 1px solid var(--line);
      background: rgba(255, 252, 244, 0.34);
    }

    .hero-frame img,
    .parade-frame img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hero-frame {
      box-shadow: inset 0 -50px 80px rgba(35, 31, 27, 0.04);
    }

    .sprite-grid {
      display: grid;
      grid-template-columns: minmax(300px, 1.45fr) minmax(170px, 0.55fr) minmax(250px, 0.8fr);
      min-height: 250px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .sprite-grid figure {
      display: grid;
      grid-template-rows: 1fr auto;
      place-items: center;
      min-width: 0;
      padding: clamp(20px, 3vw, 48px);
    }

    .sprite-grid figure + figure { border-left: 1px solid var(--line); }

    .sprite-grid img { display: block; max-width: 100%; }
    .sprite-grid .scroll img { width: 150px; }
    .sprite-grid .lantern img { width: 42px; }
    .sprite-grid .squirrel img { width: 44px; }

    .small-pieces {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr) 210px;
      align-items: center;
      gap: clamp(22px, 4vw, 70px);
      padding: clamp(24px, 4vw, 54px);
      border: 1px solid var(--line);
      background: var(--paper-raised);
    }

    .small-pieces img { display: block; max-width: 100%; }
    .small-pieces .divider { width: 100%; }

    .texture-swatch {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 50%;
    }

    .texture-swatch img { width: 100%; height: 100%; object-fit: cover; }

    .texture-swatch::after {
      content: "washi";
      position: absolute;
      inset: auto 0 16px;
      color: var(--ink-mid);
      font: 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.14em;
      text-align: center;
      text-transform: uppercase;
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      min-height: 84px;
      border: 1px solid var(--line);
    }

    .swatches span { position: relative; }
    .swatches span::after {
      content: attr(data-label);
      position: absolute;
      left: 8px;
      bottom: 7px;
      color: inherit;
      font: 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .paper { background: #f2ebdc; color: #5f5a51; }
    .raised { background: #fbf7ed; color: #5f5a51; }
    .sumi-deep { background: #211f1b; color: #f2ebdc; }
    .sumi-mid { background: #5f5a51; color: #f2ebdc; }
    .sumi-pale { background: #9c9487; color: #211f1b; }
    .vermilion { background: #b83a2c; color: #fbf7ed; }
    .indigo { background: #4b5571; color: #fbf7ed; }

    @media (max-width: 800px) {
      header { grid-template-columns: 1fr; }
      .note { text-align: left; }
      .sprite-grid { grid-template-columns: 1fr; }
      .sprite-grid figure + figure { border-left: 0; border-top: 1px solid var(--line); }
      .small-pieces { grid-template-columns: 110px 1fr; }
      .small-pieces .divider { grid-column: 1 / -1; }
      .swatches { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Light mode concept · ink &amp; wash</p>
        <h1>Spirits Along the Ridge</h1>
      </div>
      <p class="note">Mountain wash, fine contour, one vermillion breath. Familiar slots, sharper personalities.</p>
    </header>

    <section aria-labelledby="hero-title">
      <div class="section-heading">
        <h2 id="hero-title">Landscape and fox spirit</h2>
        <figcaption>1672 × 941 slot</figcaption>
      </div>
      <figure class="art-frame hero-frame">
        <img src="hero-band.svg" alt="Brush moon, mountain mist, pine, and a walking nine-tailed fox spirit">
      </figure>
    </section>

    <section aria-labelledby="parade-title">
      <div class="section-heading">
        <h2 id="parade-title">Footer spirit gathering</h2>
        <figcaption>1920 × 705 slot</figcaption>
      </div>
      <figure class="art-frame parade-frame">
        <img src="footer-parade.svg" alt="Expressive horned spirits and a fluffy guardian with one vermillion lantern">
      </figure>
    </section>

    <section aria-labelledby="sprites-title">
      <div class="section-heading">
        <h2 id="sprites-title">Object and mascot sprites</h2>
        <figcaption>Transparent assets at live CSS slot scale</figcaption>
      </div>
      <div class="sprite-grid">
        <figure class="scroll">
          <img src="scroll-ledger.svg" alt="Open scroll and brush">
          <figcaption>Ledger · 150px</figcaption>
        </figure>
        <figure class="lantern">
          <img src="chochin-lantern.svg" alt="Plain round hanging paper lantern">
          <figcaption>Lantern · 42px</figcaption>
        </figure>
        <figure class="squirrel">
          <img src="squirrel-yokai.svg" alt="Expressive ink-wash squirrel spirit holding an acorn">
          <figcaption>Mascot · 44px</figcaption>
        </figure>
      </div>
    </section>

    <section aria-labelledby="marks-title">
      <div class="section-heading">
        <h2 id="marks-title">Marks and material</h2>
        <figcaption>Small supporting details</figcaption>
      </div>
      <div class="small-pieces">
        <img src="seal-stamp.svg" alt="Fine rough-edged vermillion p seal">
        <img class="divider" src="divider.svg" alt="Dry-brush ink divider">
        <div class="texture-swatch"><img src="washi-texture.svg" alt="Warm washi texture swatch"></div>
      </div>
    </section>

    <section aria-labelledby="palette-title">
      <div class="section-heading">
        <h2 id="palette-title">Theme tokens</h2>
        <figcaption>Paper · sumi · vermillion · indigo</figcaption>
      </div>
      <div class="swatches" role="img" aria-label="Ink theme color palette">
        <span class="paper" data-label="washi"></span>
        <span class="raised" data-label="raised"></span>
        <span class="sumi-deep" data-label="sumi 900"></span>
        <span class="sumi-mid" data-label="sumi 600"></span>
        <span class="sumi-pale" data-label="sumi 300"></span>
        <span class="vermilion" data-label="vermillion"></span>
        <span class="indigo" data-label="indigo wash"></span>
      </div>
    </section>
  </main>
</body>
</html>
