<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 705" role="img" aria-labelledby="title desc">
  <title id="title">Spirit gathering beneath misty mountains</title>
  <desc id="desc">Eleven expressive ink spirits gather beneath pale mountain washes: horned dumpling spirits, a fox, plain-robed walkers, and one large fluffy guardian. A small spirit carries the only vermillion paper lantern.</desc>
  <defs>
    <linearGradient id="indigoMist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#526177" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#526177" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#526177" stop-opacity="0"/>
    </linearGradient>
    <filter id="contourRough" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.07" numOctaves="2" seed="31" result="fiber"/>
      <feDisplacementMap in="SourceGraphic" in2="fiber" scale="1.9" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <filter id="washRough" x="-15%" y="-35%" width="130%" height="170%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.006 0.025" numOctaves="3" seed="18" result="wash"/>
      <feDisplacementMap in="SourceGraphic" in2="wash" scale="25" xChannelSelector="R" yChannelSelector="G" result="wandering"/>
      <feGaussianBlur in="wandering" stdDeviation="2.2"/>
    </filter>
    <filter id="redGlow" x="-180%" y="-160%" width="460%" height="420%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

