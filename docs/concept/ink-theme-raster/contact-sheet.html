<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>piatoss.log ink-theme raster contact sheet</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #211f1b;
      background: #f2ebdc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f2ebdc;
    }

    main {
      width: min(100%, 1920px);
      margin: 0 auto;
      padding: clamp(20px, 4vw, 72px);
    }

    figure {
      margin: 0 0 clamp(28px, 5vw, 72px);
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .wide img {
      width: 100%;
      border: 1px solid rgba(52, 47, 40, 0.12);
    }

    figcaption {
      margin-top: 10px;
      color: #5f5a51;
      font-size: 13px;
      line-height: 1.45;
    }

    .sprites {
      display: grid;
      grid-template-columns: 1.45fr 1fr 1fr 0.72fr;
      gap: clamp(14px, 2vw, 32px);
      align-items: end;
    }

    .sprites figure {
      margin: 0;
      min-width: 0;
    }

    .sprites img {
      width: 100%;
      object-fit: contain;
      border: 1px solid rgba(52, 47, 40, 0.12);
    }

    .scroll img { aspect-ratio: 16 / 9; }
    .mascot img { aspect-ratio: 1; }
    .lantern img { aspect-ratio: 1; }
    .seal img { aspect-ratio: 1; }

    @media (max-width: 760px) {
      .sprites { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <figure class="wide">
      <img src="hero-band-candidate.png" alt="Misty ink landscape with pine, brush-circle moon, and distant nine-tailed fox">
      <figcaption>Hero band — approved material and restraint anchor.</figcaption>
    </figure>

    <figure class="wide">
      <img src="footer-parade.png" alt="Ink-spirit procession with a fluffy guardian and one vermillion lantern">
      <figcaption>Footer parade — eleven spirits, one guardian, one lantern.</figcaption>
    </figure>

    <section class="sprites" aria-label="Ink theme object and mascot sprites">
      <figure class="scroll">
        <img src="scroll-ledger.png" alt="Open paper scroll with a calligraphy brush">
        <figcaption>Scroll ledger — quiet record-making object.</figcaption>
      </figure>

      <figure class="mascot">
        <img src="squirrel-spirit.png" alt="Squirrel spirit with an oversized brush-stroke tail and acorn">
        <figcaption>Squirrel spirit — ink-theme mascot.</figcaption>
      </figure>

      <figure class="lantern">
        <img src="lantern.png" alt="Plain round vermillion paper lantern">
        <figcaption>Lantern — matte hanji, muted inner glow.</figcaption>
      </figure>

      <figure class="seal">
        <img src="seal-stamp.png" alt="Rough vermillion seal impression with an abstract p glyph">
        <figcaption>Seal — rough abstract p impression.</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
