<!doctype html>
<!-- OG 커버(1200×630) 소스. 1200×630으로 캡처해 public/og-cover.jpg로 저장한다. -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Diphylleia&family=Outfit:wght@500;600;700;800&family=Noto+Serif+KR:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body {
        background: #080d12;
        color: #e9e5dc;
        font-family: "Outfit", "Pretendard Variable", Pretendard, sans-serif;
      }
      .cover {
        position: relative;
        isolation: isolate;
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: flex-end;
        padding: 72px 76px;
        overflow: hidden;
        background: url("../public/dreamcore/hero-banner.webp") 47% center / cover no-repeat;
      }
      .cover::before {
        position: absolute;
        z-index: -1;
        inset: 0;
        content: "";
        background:
          linear-gradient(90deg, rgba(4, 8, 12, 0.86) 0%, rgba(4, 8, 12, 0.54) 48%, rgba(4, 8, 12, 0.1) 78%),
          linear-gradient(0deg, rgba(4, 8, 12, 0.78), transparent 68%);
      }
      .copy { max-width: 620px; }
      h1 {
        margin: 0;
        color: #f2eee6;
        font-family: "Diphylleia", "Noto Serif KR", serif;
        font-size: 84px;
        font-weight: 400;
        letter-spacing: 0.01em;
        line-height: 1;
        text-shadow: 0 3px 28px rgba(0, 0, 0, 0.8);
      }
      h1 span { color: #f0ad63; }
      p {
        margin: 24px 0 0;
        color: #c5cecb;
        font-size: 25px;
        font-weight: 500;
        line-height: 1.5;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.9);
      }
      .rule {
        width: 56px;
        height: 4px;
        margin-bottom: 24px;
        background: #d68c43;
      }
    </style>
  </head>
  <body>
    <main class="cover">
      <section class="copy">
        <div class="rule"></div>
        <h1>piatoss<span>.log</span></h1>
        <p>만들고 부수고 다시 고치는 사람의 기록</p>
      </section>
    </main>
  </body>
</html>
