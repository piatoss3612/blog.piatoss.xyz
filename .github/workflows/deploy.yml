name: Deploy

on:
  push:
    branches: [main]
    # 빌드 입력이 아닌 것들. 여기만 바뀐 푸시는 배포하지 않는다 — 산출물이 같으니까.
    # scripts/는 일회성 도구(변환·에셋 준비)라 astro build가 읽지 않는다.
    # 이 목록에 없는 파일이 하나라도 섞이면 워크플로는 정상적으로 돈다.
    paths-ignore:
      - "docs/**"
      - "scripts/**"
      - "DESIGN.md"
      - "Makefile"
      - ".gitignore"
  # 위 경로만 바꿨는데 재배포가 필요하면 여기서 수동으로 돌린다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 취소하면 사이트가 반쯤 올라간 상태로 남는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # astro build 다음에 pagefind가 dist를 색인한다 — 순서는 package.json의 build에 있다
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
